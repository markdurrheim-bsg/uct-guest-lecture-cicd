name: Reusable Test

on:
  workflow_call:

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build the project
      - name: Build
        run: npm run build

      # Run unit tests
      - name: Run Unit Tests
        run: npm run test
