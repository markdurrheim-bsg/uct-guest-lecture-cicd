name: Reusable Deploy To GitHub Pages

on:
  workflow_call:

jobs:
  deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fetch the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build the project
      # - Note: The base-href is set to the repository name to ensure correct routing on GitHub Pages
      - name: Build
        run: npm run build -- --base-href /uct-guest-lecture-cicd/

      # Set up GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the build artifact
      # - Note: The path should point to the directory containing the static files to be served by GitHub Pages
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/uct-guest-lecture-cicd/browser/

      # Deploy to GitHub Pages
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
